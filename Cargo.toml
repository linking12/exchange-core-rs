# exchange-core Rust 移植 · 单 crate
# 设计文档: docs/superpowers/specs/2026-08-31-exchange-core-rust-port-design.md
# 参考骨架: https://github.com/llc-993/matching-core
[package]
name = "exchange-core-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[features]
# 测试内省访问器(ExchangeApi::ups/ssp/risk/user_position/last_*)的门控开关。
# 经下方 self dev-dependency 在本 crate 自测时自动开启;外部依赖者默认不编译这些方法,故调用不到。
testing = []

[dependencies]
# 日志门面（facade only，无 backend）：纯副作用、不碰复制态、不影响确定性；无 logger 时宏短路零开销。
log = "0.4"
# 快照 .dat 帧的 LZ4 解码（module_frame）；Java 生产快照可选压缩。
lz4_flex = "0.11"
# 内部批量扫描（funding/强平/ADL/loan）的确定性并行执行池（ComputePool）。
rayon = "1"

[dev-dependencies]
proptest = "1"
# self dev-dependency:让 `cargo test` 自动带上 testing feature,看到内省访问器。
exchange-core-rs = { path = ".", features = ["testing"] }

# 纯引擎吞吐:绕开 Raft 直灌 process_command。跑:cargo bench --bench engine_throughput
[[bench]]
name = "engine_throughput"
harness = false

# 单命令停顿:funding/强平在 N 持仓下阻塞单管线的墙钟。跑:cargo bench --bench parallel_scan_bench
[[bench]]
name = "parallel_scan_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
